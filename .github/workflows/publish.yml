name: Publish to JitPack

permissions:
  contents: read

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # JitPack builds lazily on first request, so request the artifact now and wait for it
      - name: Trigger JitPack build and wait
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          base="https://jitpack.io/com/github/kylecorry31/sol/${TAG}"
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -L "${base}/sol-${TAG}.pom")
            echo "Attempt ${attempt}: HTTP ${status}"
            if [ "${status}" = "200" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "JitPack build did not finish in time. Build log:"
          curl -s -L "${base}/build.log" | tail -50
          exit 1
